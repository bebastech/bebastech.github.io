<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ededed; }
        .glass-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen selection:bg-white selection:text-black">
    <nav class="p-6 md:p-10 flex justify-between items-center max-w-3xl mx-auto w-full">
        <a href="/" class="text-xl font-extrabold tracking-tighter text-white">BEBASTECH.</a>
        <a href="/" class="text-sm font-medium text-gray-500 hover:text-white transition">Beranda</a>
    </nav>
    <main class="max-w-3xl mx-auto w-full px-6 py-10 flex-grow">
        <div class="prose prose-invert prose-lg md:prose-xl max-w-none prose-p:text-gray-400 prose-headings:text-white prose-a:text-white prose-a:underline-offset-4">
            {{ content }}
        </div>
    </main>
    <footer class="text-center py-10 text-xs text-gray-700 font-bold tracking-widest uppercase mt-auto">
        © 2026 BebasTech
    </footer>
</body>
</html>
