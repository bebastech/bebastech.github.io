<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "BebasTech - Ruang Opini & Teknologi" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 900: '#0f172a', 800: '#1e293b' } } } }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .artikel-konten p { margin-bottom: 1.25rem; line-height: 1.75; color: #cbd5e1; }
        .artikel-konten h1, .artikel-konten h2 { font-weight: bold; color: #f8fafc; margin-top: 2rem; margin-bottom: 1rem; }
        .artikel-konten h1 { font-size: 2.25rem; }
        .artikel-konten h2 { font-size: 1.5rem; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">
    
    <!-- Navigasi Atas -->
    <nav class="border-b border-gray-800 bg-gray-900 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-extrabold tracking-tight text-blue-500 hover:text-blue-400">BebasTech.</a>
            <div class="space-x-4 text-sm font-semibold text-gray-300">
                <a href="/" class="hover:text-blue-400 transition">Beranda</a>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="max-w-3xl mx-auto px-6 py-12 flex-grow w-full artikel-konten">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 bg-gray-900 py-8 mt-auto text-center text-gray-500 text-sm font-medium">
        &copy; 2026 BebasTech. Dibangun untuk kebebasan beropini.
    </footer>

</body>
</html>
